<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <meta name="description" content="A focused everyday calculator." />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page-shell">
      <section class="calculator-card" aria-label="Calculator">
        <div class="calculator-topline" aria-hidden="true">
          <span>Standard</span>
          <span class="topline-status">Ready</span>
        </div>

        <div class="display" aria-live="polite" aria-atomic="true">
          <div class="display-row expression-line">
            <span
              class="display-text"
              id="expression-display"
              data-testid="text-expression"
            >
              0
            </span>
          </div>

          <div class="display-row result-line">
            <span
              class="display-text"
              id="result-display"
              data-testid="text-result"
            >
              0
            </span>
          </div>
        </div>

        <div class="keypad" role="group" aria-label="Calculator keypad">
          <button
            class="key key-utility"
            type="button"
            data-action="clear"
            data-testid="button-clear"
            aria-label="Clear calculator"
          >
            C
          </button>

          <button
            class="key key-utility"
            type="button"
            data-action="delete"
            data-testid="button-delete"
            aria-label="Delete last entry"
          >
            DEL
          </button>

          <button
            class="key key-operator"
            type="button"
            data-value="÷"
            data-testid="button-divide"
            aria-label="Divide"
          >
            ÷
          </button>

          <button
            class="key key-operator"
            type="button"
            data-value="×"
            data-testid="button-multiply"
            aria-label="Multiply"
          >
            ×
          </button>

          <button
            class="key"
            type="button"
            data-value="7"
            data-testid="button-number-7"
            aria-label="Seven"
          >
            7
          </button>

          <button
            class="key"
            type="button"
            data-value="8"
            data-testid="button-number-8"
            aria-label="Eight"
          >
            8
          </button>

          <button
            class="key"
            type="button"
            data-value="9"
            data-testid="button-number-9"
            aria-label="Nine"
          >
            9
          </button>

          <button
            class="key key-operator"
            type="button"
            data-value="−"
            data-testid="button-subtract"
            aria-label="Subtract"
          >
            −
          </button>

          <button
            class="key"
            type="button"
            data-value="4"
            data-testid="button-number-4"
            aria-label="Four"
          >
            4
          </button>

          <button
            class="key"
            type="button"
            data-value="5"
            data-testid="button-number-5"
            aria-label="Five"
          >
            5
          </button>

          <button
            class="key"
            type="button"
            data-value="6"
            data-testid="button-number-6"
            aria-label="Six"
          >
            6
          </button>

          <button
            class="key key-operator"
            type="button"
            data-value="+"
            data-testid="button-add"
            aria-label="Add"
          >
            +
          </button>

          <button
            class="key"
            type="button"
            data-value="1"
            data-testid="button-number-1"
            aria-label="One"
          >
            1
          </button>

          <button
            class="key"
            type="button"
            data-value="2"
            data-testid="button-number-2"
            aria-label="Two"
          >
            2
          </button>

          <button
            class="key"
            type="button"
            data-value="3"
            data-testid="button-number-3"
            aria-label="Three"
          >
            3
          </button>

          <button
            class="key key-equals"
            type="button"
            data-action="equals"
            data-testid="button-equals"
            aria-label="Equals"
          >
            =
          </button>

          <button
            class="key key-zero"
            type="button"
            data-value="0"
            data-testid="button-number-0"
            aria-label="Zero"
          >
            0
          </button>

          <button
            class="key"
            type="button"
            data-value="."
            data-testid="button-decimal"
            aria-label="Decimal point"
          >
            .
          </button>
        </div>

        <p class="sr-only" id="keyboard-help">
          Use the number keys, operators, Enter, Backspace, and Escape to
          operate the calculator.
        </p>
      </section>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
